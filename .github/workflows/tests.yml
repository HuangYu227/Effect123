name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: |
          python scripts/create_fake_weather.py --output /tmp/fake_weather
          python scripts/train_weather.py --config configs/weather_core.yaml --data-root /tmp/fake_weather --max-steps 1 --batch-size 2 --text-encoder-mode hash --checkpoint-dir /tmp/effectcma_ckpt
          python scripts/eval_weather.py --config configs/weather_core.yaml --data-root /tmp/fake_weather --checkpoint /tmp/effectcma_ckpt/latest.pt --max-batches 1
          python scripts/sample_weather.py --config configs/weather_core.yaml --data-root /tmp/fake_weather --checkpoint /tmp/effectcma_ckpt/latest.pt --index 0 --output /tmp/effectcma_sample.png
