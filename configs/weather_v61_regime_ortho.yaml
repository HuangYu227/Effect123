task:
  mode: text2ts

data:
  root: null
  window_length: null
  normalize: true
  caption_policy: random
  include_precomputed_embeddings: false
  seed: 20260609

model:
  d_model: 256
  patch_len: 6
  num_operators: 3
  transformer_layers: 2
  transformer_heads: 4
  channel_patch_len: 6
  channel_stride: 3
  channel_temporal_layers: 1
  channel_layers: 1
  channel_heads: 4
  channel_dropout: 0.0

  # Legacy mapper config (kept for ablation, not used when router_mode=global_operator)
  mapper_field_rank: 4
  mapper_slot_layers: 1
  mapper_slot_heads: 4
  mapper_dropout: 0.0
  mapper_normalizer: softmax
  mapper_bounded_field_gate: true
  mapper_gate_rescale: auto
  mapper_operator_router: text
  mapper_time_segment_scales: [1]
  mapper_router_epsilon: 0.0001
  mapper_flow_time_condition: true

  # Mechanism-Aware Velocity Block
  operator_architecture: structural
  operator_hidden: 128
  operator_t_dim: 32
  operator_max_velocity: 5.0
  operator_depth: 2
  operator_kernel_size: 3
  operator_dropout: 0.0
  operator_context_mode: global
  operator_context_film: true
  operator_norm: group
  operator_channel_heads: 4

  # V6.1: Latent Regime Condition Adapter
  use_latent_regime_adapter: true
  num_regimes: 4
  regime_dim: 256
  regime_hidden_dim: 256
  regime_temperature: 0.7
  regime_posterior_mode: learned
  regime_append_token: false
  regime_state_weight_mode: linear_t

  # V6.1: Global Operator Gate (replaces A_t/A_c router)
  router_mode: global_operator

text_encoder:
  mode: longclip
  hash_dim: 256
  precomputed_dim: 128
  hf_model_name: "BAAI/bge-small-en-v1.5"
  longclip_model_name: "save/Longclip"
  longclip_local_files_only: true
  local_files_only: false
  fallback_mode: error
  fallback_hash_dim: 256

train:
  batch_size: 1024
  eval_batch_size: 512
  lr: 0.0001
  weight_decay: 0.0001
  max_steps: 10000
  cfm_loss_mode: global
  noise_scale: 1.0

  caption_slot_strategy: single
  max_caption_slots: 1
  include_all_caption_candidates: false
  routing_loss_weight: 0.0
  regime_ortho_weight: 0.0001
  condition_dropout_prob: 0.0
  warmup_steps: 200
  min_lr: 1.0e-6

  grad_clip: 1.0
  num_workers: 0
  device: auto
  checkpoint_dir: checkpoints/v61_regime_ortho
  log_every: 20
  eval_every: 200
  eval_batches: 4
  eval_seed_offset: 50000
  best_metric: verbalts_jftsd
  save_every: 1000

sample:
  solver: rk4
  steps: 32
  noise_scale: 1.0
  # Step 2: after regime validated, enable CFG with scale > 1.0.
  cfg_scale: 1.0
