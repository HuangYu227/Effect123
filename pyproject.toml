[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effectcma-flow"
version = "0.1.0"
description = "Cross-modal effect mapping for text-induced residual flow in time series generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.64",
  "matplotlib>=3.6",
  "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["effectcma_flow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
